name: Unpack AI Creative OS Source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/unpack-source.yml"
      - ".bootstrap/source.part16.b64"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/source.part*.b64 > /tmp/ai-creative-os-source.b64
          base64 --decode /tmp/ai-creative-os-source.b64 > /tmp/ai-creative-os-source.tar.gz
          echo "145fe205b32c209779df876d4427395ee20da4cd6b6dbf4bcec033c5de9b2963  /tmp/ai-creative-os-source.tar.gz" | sha256sum -c -

      - name: Extract project source
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/ai-creative-os-source.tar.gz -C .
          rm -rf .bootstrap
          rm -f apps/web/tsconfig.tsbuildinfo
          # The Actions token cannot add workflow files; CI is added separately after source import.
          rm -f .github/workflows/ci.yml

          # Safety: never commit runtime secrets.
          find . -maxdepth 4 -type f \( -name ".env" -o -name ".env.local" -o -name ".env.production" -o -name ".env.development" \) -delete

      - name: Commit unpacked source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "chore: unpack AI Creative OS source"
          git push origin HEAD:main

