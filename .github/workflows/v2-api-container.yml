name: V2 API container

on:
  push:
    branches: [v2-nalarin-studio]
    paths:
      - "scripts/v2-stack/**"
      - ".github/workflows/v2-api-container.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: v2-api-container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize pinned Nalarin source
        run: bash scripts/v2-stack/prepare.sh
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish FastAPI image
        uses: docker/build-push-action@v6
        with:
          context: .v2-stack/nalarin
          file: .v2-stack/nalarin/backend/Dockerfile
          push: true
          tags: |
            ghcr.io/belalaamer/ai-creative-os-v2-api:latest
            ghcr.io/belalaamer/ai-creative-os-v2-api:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/belalaamer/ai-creative-os
            org.opencontainers.image.licenses=MIT
