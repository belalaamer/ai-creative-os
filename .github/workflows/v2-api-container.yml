name: V2 API container

on:
  push:
    branches: [v2-nalarin-studio]
    paths:
      - "deploy/railway-api/**"
      - "scripts/v2-stack/patch-backend.py"
      - "scripts/v2-stack/smoke-api.py"
      - "tests/v2/**"
      - ".github/workflows/v2-api-container.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: v2-api-container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify backend deployment regressions
        run: python -m unittest discover -s tests/v2 -v
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Creative OS V2 FastAPI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/railway-api/Dockerfile
          load: true
          tags: |
            ghcr.io/belalaamer/ai-creative-os-v2-api:latest
            ghcr.io/belalaamer/ai-creative-os-v2-api:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/belalaamer/ai-creative-os
            org.opencontainers.image.licenses=MIT
      - name: Verify fresh database, login and restart before publishing
        run: python tests/v2/smoke_api_container.py ghcr.io/belalaamer/ai-creative-os-v2-api:${{ github.sha }}
      - name: Publish verified image
        run: |
          docker push ghcr.io/belalaamer/ai-creative-os-v2-api:${{ github.sha }}
          docker push ghcr.io/belalaamer/ai-creative-os-v2-api:latest
