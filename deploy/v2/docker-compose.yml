name: creative-os-v2

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ads_studio
      POSTGRES_USER: ads_studio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-creative_os_dev}
    volumes:
      - creative_os_v2_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ads_studio -d ads_studio"]
      interval: 5s
      timeout: 5s
      retries: 20

  ads-backend:
    build:
      context: ../../.v2-stack/nalarin
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://ads_studio:${POSTGRES_PASSWORD:-creative_os_dev}@postgres:5432/ads_studio
      SECRET_KEY: ${SECRET_KEY}
      OAUTH_TOKEN_ENCRYPTION_KEY: ${OAUTH_TOKEN_ENCRYPTION_KEY}
      ALLOWED_ORIGINS: http://localhost:3024,http://localhost:3030
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      GOOGLE_ADS_CLIENT_ID: ${GOOGLE_ADS_CLIENT_ID:-}
      GOOGLE_ADS_CLIENT_SECRET: ${GOOGLE_ADS_CLIENT_SECRET:-}
      TIKTOK_ADS_APP_ID: ${TIKTOK_ADS_APP_ID:-}
      TIKTOK_ADS_APP_SECRET: ${TIKTOK_ADS_APP_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  ads-frontend:
    build:
      context: ../../.v2-stack/nalarin/frontend
      dockerfile: Dockerfile
    depends_on:
      - ads-backend
    ports:
      - "3024:80"

  studio:
    image: oven/bun:1.3
    working_dir: /workspace
    command: sh -lc "bun install && cd apps/demo && bun run dev --hostname 0.0.0.0 --port 3030"
    volumes:
      - ../../.v2-stack/studio271:/workspace
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: http://localhost:3030
      TRIGGER_SECRET_KEY: ${TRIGGER_SECRET_KEY}
      TRIGGER_PROJECT_REF: ${TRIGGER_PROJECT_REF}
      RUNPOD_API_KEY: ${RUNPOD_API_KEY}
      RUNPOD_ENDPOINT_ID: ${RUNPOD_ENDPOINT_ID}
      RUNPOD_VIDEO_ENDPOINT_ID: ${RUNPOD_VIDEO_ENDPOINT_ID}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      NEXT_PUBLIC_ADS_URL: http://localhost:3024
    ports:
      - "3030:3030"

volumes:
  creative_os_v2_postgres:
